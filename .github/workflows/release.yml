name: Release
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - if: github.event_name == 'release'
        run: node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Release tag must match package version");'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm install -g npm@11.21.0
      - run: npm ci --ignore-scripts
      - run: mkdir -p .local && npm pack --pack-destination .local
      - run: npm publish .local/*.tgz --ignore-scripts --access public
