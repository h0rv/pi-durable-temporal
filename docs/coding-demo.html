ocument.getElementById('play');let timer;function render(){terminal.textContent=events.filter(event=>event[0]<=Number(range.value)).map(event=>event[2]).join('');document.getElementById('clock').textContent=`${Number(range.value).toFixed(1)}s`}range.oninput=render;button.onclick=()=>{if(timer){clearInterval(timer);timer=undefined;button.textContent='Play';return}if(Number(range.value)>=34)range.value=0;button.textContent='Pause';timer=setInterval(()=>{range.value=Math.min(34,Number(range.value)+.1);render();if(Number(range.value)>=34){clearInterval(timer);timer=undefined;button.textContent='Replay'}},100)};render();</script></html>
